{% extends 'base.html' %}{% block body %}<h1 class="h3">Registrar ausência docente</h1><div class="card p-4"><form method="post"><div class="row g-3"><div class="col-md-4"><label class="form-label">Professor</label><select required name="professor_id" class="form-select">{% for x in professores %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Turma</label><select required name="turma_id" class="form-select">{% for x in turmas %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Disciplina</label><select required name="disciplina_id" class="form-select">{% for x in disciplinas %}<option value="{{x.id}}">{{x.nome}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Data</label><input type="date" required name="data" value="{{hoje}}" class="form-control"></div><div class="col-md-4"><label class="form-label">Início</label><input type="time" required name="inicio" value="19:00" class="form-control"></div><div class="col-md-4"><label class="form-label">Fim</label><input type="time" required name="fim" value="20:40" class="form-control"></div><div class="col-md-6"><label class="form-label">Motivo</label><select name="motivo" class="form-select"><option>Saúde</option><option>Imprevisto</option><option>Institucional</option><option>Outros</option></select></div><div class="col-md-6"><label class="form-label">Observações</label><input name="observacoes" class="form-control"></div></div><button class="btn btn-primary mt-4">Registrar e classificar aula vaga</button></form></div>{% endblock %}
