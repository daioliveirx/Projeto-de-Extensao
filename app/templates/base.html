<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão Docente | Protótipo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f7fb;color:#132e45}.navbar{background:#132e45}.card{border:1px solid #dde6ee;border-radius:15px}.btn-primary{background:#087f72;border-color:#087f72}.tag{font-size:.75rem;color:#5c6d7d}.stat{font-size:2rem;font-weight:750}</style></head><body><nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="{{url_for('index')}}">Gestão Docente <small class="tag text-white">| Protótipo acadêmico</small></a><a class="btn btn-outline-light btn-sm" href="{{url_for('nova')}}">+ Registrar ausência</a></div></nav><main class="container py-4">{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert alert-{{'success' if cat=='ok' else 'danger'}}">{{msg}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main><footer class="container pb-4 text-muted small">Projeto de Extensão • Equipe ADS 4A • Dados fictícios • Não integrado à instituição</footer></body></html>
